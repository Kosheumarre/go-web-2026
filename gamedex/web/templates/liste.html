{{template "header" .}}
<h1>Les jeux</h1>

<form class="recherche" action="/jeux" method="get">
  <input type="search" name="q" value="{{.Query}}" placeholder="Rechercher un jeu">
  <select name="genre">
    <option value="">Tous les genres</option>
    {{range .Genres}}
      <option value="{{.}}" {{if eq . $.Genre}}selected{{end}}>{{.}}</option>
    {{end}}
  </select>
  <button type="submit">Filtrer</button>
</form>

{{if .Query}}
  <p class="info">Vous avez cherché : {{.Query}}</p>
{{end}}

{{if .Games}}
<ul class="jeux">
  {{range .Games}}
    <li>
      <a href="/jeux/{{.ID}}">{{.Name}}</a>
      <span class="meta">
        <span class="likes">♥ {{index $.Likes .ID}}</span>
        <span class="annee">{{.Year}}</span>
      </span>
    </li>
  {{end}}
</ul>
{{else}}
  <p>Aucun jeu trouvé.</p>
{{end}}
{{template "footer" .}}
